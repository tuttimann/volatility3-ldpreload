name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # actions/setup-python ships no Python 3.9 build for the current ubuntu-latest
    # image; that job stays on the last image that has one.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Volatility 3
        run: python -m pip install "volatility3>=2.26"
      - name: Byte-compile the plugin
        run: python -m py_compile linux/ldpreload.py
      - name: Load the plugin through the framework
        run: vol -p . linux.ldpreload.LdPreload --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v

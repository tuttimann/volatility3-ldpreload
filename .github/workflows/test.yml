name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # actions/setup-python ships no Python 3.9 build for the current ubuntu-latest
    # image; that job stays on the last image that has one.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Volatility 3
        run: python -m pip install "volatility3>=2.26"
      - name: Byte-compile the plugin
        run: python -m py_compile linux/ldpreload.py
      - name: Load the plugin through the framework
        run: vol -p . linux.ldpreload.LdPreload --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  minimum-framework:
    # The oldest framework the plugin accepts (_required_framework_version
    # 2.26.0), so that a call into an API added later fails here. Python 3.12:
    # inside the framework's declared requires-python (>=3.8), established
    # well before 2.26.0, and it has a setup-python build on ubuntu-latest
    # (the 3.12 job above runs there). 3.9 would need the older runner; the
    # newer Pythons are covered by the matrix with the current framework.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Volatility 3 2.26.0
        run: python -m pip install "volatility3==2.26.0"
      - name: Byte-compile the plugin
        run: python -m py_compile linux/ldpreload.py
      - name: Load the plugin through the framework
        run: vol -p . linux.ldpreload.LdPreload --help
      - name: Unit tests
        run: python -m unittest discover -s tests -v
